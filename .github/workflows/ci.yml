name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gocart
          POSTGRES_PASSWORD: gocart
          POSTGRES_DB: gocart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gocart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: postgres://gocart:gocart@127.0.0.1:5432/gocart

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest

      - name: OpenAPI schema is valid
        run: python manage.py spectacular --file "$RUNNER_TEMP/openapi.yaml" --validate --fail-on-warn
