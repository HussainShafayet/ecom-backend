          type: array
          items:
            $ref: '#/components/schemas/MediaFile'
          description: The colour's own media, else the shared product media.
        sizes:
          type: array
          items:
            $ref: '#/components/schemas/SizeOption'
        variant_id:
          type: integer
        base_price:
          type: number
          format: double
          maximum: 10000000000
          minimum: -10000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
        discount_price:
          type: number
          format: double
          maximum: 10000000000
          minimum: -10000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
