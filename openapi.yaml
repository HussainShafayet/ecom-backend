      - media_files
      - name
      - sizes
    ContentItem:
      type: object
      properties:
        order:
          type: integer
          description: 1, 2, 3... within its list (unique, so it can be a React key).
        type:
          $ref: '#/components/schemas/TypeEnum'
        link:
          type: string
          nullable: true
          description: Slug of the product or category; null for another website.
        external_link:
          type: string
          nullable: true
          description: Only for type `external`.
        media:
          type: string
          format: uri
        media_type:
          $ref: '#/components/schemas/MediaTypeEnum'
        caption:
          type: string
      required:
