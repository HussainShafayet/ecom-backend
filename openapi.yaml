          type: string
          maxLength: 14
        shipping_type:
          $ref: '#/components/schemas/ShippingTypeEnum'
        shipping_area:
          type: string
          maxLength: 100
        shipping_division:
          type: string
          maxLength: 100
        shipping_district:
          type: string
          maxLength: 100
        shipping_thana:
          type: string
          maxLength: 100
        shipping_address:
          type: string
          maxLength: 500
        subtotal:
          type: number
          format: double
          maximum: 10000000000
          minimum: 0
          exclusiveMaximum: true
        delivery_charge:
          type: number
          format: double
          maximum: 10000000000
          minimum: 0
          exclusiveMaximum: true
        discount_amount:
          type: number
          format: double
          maximum: 10000000000
          minimum: 0
          exclusiveMaximum: true
          description: What the coupon took off. 0 when there was none.
        coupon_code:
          type: string
          readOnly: true
          description: '"" when no coupon was used.'
        payment:
          allOf:
          - $ref: '#/components/schemas/OrderPayment'
          nullable: true
          readOnly: true
          description: null when the order has no payment record.
        history:
          type: array
          items:
            $ref: '#/components/schemas/OrderStep'
          readOnly: true
          description: Every status the order has been in, oldest first.
        can_cancel:
          type: boolean
          readOnly: true
          description: 'True while the order is pending: only then may the customer
            cancel it.'
        expected_delivery:
          allOf:
          - $ref: '#/components/schemas/ExpectedDelivery'
          nullable: true
          readOnly: true
          description: '`{earliest, latest}` dates while the order is on its way and
            the shop made an estimate, else null.'
