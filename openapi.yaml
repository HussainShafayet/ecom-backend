    ReviewPage:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        can_review:
          type: boolean
          description: A delivered order of theirs contains the product and they have
            not reviewed it yet.
        review_status:
          allOf:
          - $ref: '#/components/schemas/ReviewStatusEnum'
          description: |-
            Where the customer stands: `can_review`; `reviewed` (once only); `waiting_for_delivery` (ordered, not delivered yet: see `order_id`); `not_purchased`; `guest` (not signed in).

            * `can_review` - can_review
            * `reviewed` - reviewed
            * `waiting_for_delivery` - waiting_for_delivery
            * `not_purchased` - not_purchased
            * `guest` - guest
        order_id:
          type: string
          nullable: true
          description: 'With `waiting_for_delivery`: the number of the order they
            are waiting for (GET /orders/{order_id}/), else null.'
