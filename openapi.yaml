  /api/v1/products/:
    get:
      operationId: products_list
      summary: 'List products: filters, sorting, pagination'
      parameters:
      - in: query
        name: brands
        schema:
          type: string
        description: Comma separated brand names.
      - in: query
        name: category
        schema:
          type: string
        description: Category slug. Includes the categories below it.
      - in: query
        name: colors
        schema:
          type: string
        description: Comma separated colour names.
      - in: query
        name: discount_type
        schema:
          enum:
          - percentage
          - fixed
          - ''
          type: string
        description: |-
          * `percentage` - Percentage
          * `fixed` - Fixed amount
      - in: query
        name: discount_value
        schema:
          type: number
          format: double
          maximum: 10000000000
          minimum: 0
          exclusiveMaximum: true
      - in: query
        name: max_price
        schema:
          type: number
          format: double
          maximum: 10000000000
          minimum: 0
          exclusiveMaximum: true
        description: Highest price the customer pays.
      - in: query
        name: min_price
        schema:
          type: number
          format: double
          maximum: 10000000000
          minimum: 0
          exclusiveMaximum: true
        description: Lowest price the customer pays.
      - in: query
        name: ordering
        schema:
          enum:
          - price
          - -price
          - discount_price
          - -discount_price
          - rating
          - -rating
          - ''
          type: string
        description: |-
          Empty = newest first. `price` sorts before the discount, `discount_price` by what the customer pays.

          * `price` - price
          * `-price` - -price
          * `discount_price` - discount_price
          * `-discount_price` - -discount_price
          * `rating` - rating
          * `-rating` - -rating
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
          maxLength: 100
        description: Words that must all appear in the name, SKU, model, brand or
          a tag.
      - in: query
        name: sizes
        schema:
          type: string
        description: Comma separated size names.
      - in: query
        name: tags
        schema:
          type: string
        description: Comma separated tag names.
      tags:
      - catalog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: OK
                  data:
                    $ref: '#/components/schemas/PaginatedProductListList'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        5XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
