components:
  schemas:
    ActionEnum:
      enum:
      - increase
      - decrease
      type: string
      description: |-
        * `increase` - increase
        * `decrease` - decrease
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 100
        shipping_type:
          $ref: '#/components/schemas/ShippingTypeEnum'
        address:
          type: string
          maxLength: 500
        area:
          type: string
          maxLength: 100
        division:
          type: string
          maxLength: 100
        district:
          type: string
          maxLength: 100
        thana:
          type: string
          maxLength: 100
      required:
      - address
      - id
      - shipping_type
    AddressRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 100
        shipping_type:
          $ref: '#/components/schemas/ShippingTypeEnum'
        address:
          type: string
          minLength: 1
          maxLength: 500
        area:
          type: string
          maxLength: 100
        division:
          type: string
          maxLength: 100
        district:
          type: string
          maxLength: 100
        thana:
          type: string
          maxLength: 100
      required:
      - address
      - shipping_type
    Announcement:
      type: object
      properties:
        text:
          type: string
        link:
          type: string
          nullable: true
          description: A page of the shop (/products/flash-sale), https://..., or
            null.
        ends_in_seconds:
          type: integer
          nullable: true
          description: 'Seconds until the bar should disappear, measured by the server
            (rounded up, at least 1); null: no end was set.'
      required:
      - ends_in_seconds
      - link
      - text
    BlankEnum:
      enum:
      - ''
    CartAddRequest:
      type: object
      properties:
        product_id:
          type: integer
          minimum: 1
        quantity:
          type: integer
          maximum: 10000
          minimum: 1
          default: 1
          description: A delta, not the new total.
        variant_id:
          type: integer
          minimum: 1
          nullable: true
          description: May be left out when the product has exactly one variant.
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          default: increase
      required:
      - product_id
    CartItem:
      type: object
      description: |-
        A product card plus the cart line. `id` is the PRODUCT id. Price, image, `variant_id` and availability are
        those of the chosen variant: `cart_items()` prepares one product copy per line that way.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          description: Leave empty to generate it from the name.
          pattern: ^[-a-zA-Z0-9_]+$
        sku:
          type: string
          readOnly: true
        image:
          type: string
          format: uri
          nullable: true
          readOnly: true
        base_price:
          type: number
          format: double
          maximum: 10000000000
          minimum: -10000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          readOnly: true
        discount_price:
          type: number
          format: double
          maximum: 10000000000
          minimum: -10000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          readOnly: true
          description: What the customer pays; equals base_price without a discount.
        has_discount:
          type: boolean
          readOnly: true
        discount_type:
          type: string
          nullable: true
          readOnly: true
        discount_value:
          type: number
          format: double
          maximum: 10000000000
          minimum: -10000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          readOnly: true
        brand_name:
          type: string
          nullable: true
          readOnly: true
        total_views:
          type: integer
          readOnly: true
        total_orders:
          type: integer
          readOnly: true
        total_reviews:
          type: integer
          readOnly: true
        avg_rating:
          type: number
          format: double
          maximum: 10
          minimum: -10
          exclusiveMaximum: true
          exclusiveMinimum: true
          readOnly: true
        availability_status:
          type: boolean
          readOnly: true
        has_variants:
          type: boolean
          readOnly: true
          description: True when the customer has to pick a colour or size.
        variant_id:
          type: integer
          readOnly: true
          nullable: true
        minimum_order_quantity:
          type: integer
          readOnly: true
        is_favourite:
          type: boolean
          readOnly: true
        quantity:
          type: integer
          readOnly: true
        color_name:
          type: string
          nullable: true
          readOnly: true
        color_hex_code:
          type: string
          nullable: true
          readOnly: true
        size_name:
          type: string
          nullable: true
          readOnly: true
      required:
      - availability_status
      - avg_rating
      - base_price
      - brand_name
      - color_hex_code
      - color_name
      - discount_price
      - discount_type
      - discount_value
      - has_discount
      - has_variants
      - id
      - image
      - is_favourite
      - minimum_order_quantity
      - name
      - quantity
      - size_name
      - sku
      - slug
      - total_orders
      - total_reviews
      - total_views
      - variant_id
    CartRefRequest:
      type: object
      properties:
        product_id:
          type: integer
          minimum: 1
        variant_id:
          type: integer
          minimum: 1
          nullable: true
          description: Left out = every line of that product.
      required:
      - product_id
    CategoryList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          description: Leave empty to generate it from the name.
          pattern: ^[-a-zA-Z0-9_]+$
        image:
          type: string
          format: uri
          nullable: true
          readOnly: true
        has_discount:
          type: boolean
          readOnly: true
        discount_amount:
          type: number
          format: double
          maximum: 10000000000
          minimum: -10000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          readOnly: true
        discount_type:
          type: string
          nullable: true
          readOnly: true
      required:
      - discount_amount
      - discount_type
      - has_discount
      - id
      - image
      - name
      - slug
    CategoryRef:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - name
      - slug
    CheckoutContent:
      type: object
      properties:
        delivery_charges:
          allOf:
          - $ref: '#/components/schemas/DeliveryCharges'
          description: A shipping type without a configured charge is left out (ordering
            with it is a 400).
        delivery_estimates:
          allOf:
          - $ref: '#/components/schemas/DeliveryEstimates'
          description: 'How many calendar days delivery takes, per shipping type:
            only for a type the shop made an estimate for.'
        shipping_addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
          description: The customer's saved addresses; [] for a guest.
        user_info:
          allOf:
          - $ref: '#/components/schemas/UserInfo'
          nullable: true
          description: null for a guest.
      required:
      - delivery_charges
      - delivery_estimates
      - shipping_addresses
      - user_info
    ColorOption:
      type: object
      properties:
        name:
          type: string
        hex_code:
          type: string
        media_files:
          type: array
          items:
            $ref: '#/components/schemas/MediaFile'
          description: The colour's own media, else the shared product media.
        sizes:
          type: array
          items:
            $ref: '#/components/schemas/SizeOption'
        variant_id:
          type: integer
        base_price:
          type: number
          format: double
          maximum: 10000000000
          minimum: -10000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
        discount_price:
          type: number
          format: double
          maximum: 10000000000
          minimum: -10000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
        availability_status:
          type: boolean
      required:
      - hex_code
      - media_files
      - name
      - sizes
    ContactDetails:
      type: object
      properties:
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        opening_hours:
          type: string
        map_url:
          type: string
          description: 'The src of an embedded map; empty: show no map.'
      required:
      - address
      - email
      - map_url
      - opening_hours
      - phone
    ContactMessageRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        phone:
          type: string
          maxLength: 30
        subject:
          type: string
          maxLength: 150
        message:
          type: string
          minLength: 5
          maxLength: 2000
      required:
      - email
      - message
      - name
    ContentItem:
      type: object
      properties:
        order:
          type: integer
