              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: orders_create
      description: 'Prices and totals in the body are ignored: the server prices every
        line from the catalog and adds the configured delivery charge. An optional
        `coupon_code` is redeemed against the server''s own subtotal, never the client''s.
        Every problem (unknown or hidden product, stock, minimum order quantity, a
        bad or expired coupon, ...) comes back together as a 400 with `errors: [sentence,
        ...]`, and nothing is written. A signed-in customer''s ordered lines leave
        their server cart.'
      summary: Place an order (guest or signed in)
      tags:
      - orders
      requestBody:
        content:
