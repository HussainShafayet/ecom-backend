          type: string
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - name
      - slug
    CheckoutContent:
      type: object
      properties:
        delivery_charges:
          allOf:
          - $ref: '#/components/schemas/DeliveryCharges'
          description: A shipping type without a configured charge is left out (ordering
            with it is a 400).
        shipping_addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
          description: The customer's saved addresses; [] for a guest.
        user_info:
          allOf:
          - $ref: '#/components/schemas/UserInfo'
          nullable: true
          description: null for a guest.
      required:
      - delivery_charges
      - shipping_addresses
      - user_info
    ColorOption:
