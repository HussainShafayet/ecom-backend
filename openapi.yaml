          type: integer
          minimum: 1
        quantity:
          type: integer
          maximum: 10000
          minimum: 1
          default: 1
          description: A delta, not the new total.
        variant_id:
          type: integer
          minimum: 1
          nullable: true
          description: May be left out when the product has exactly one variant.
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          default: increase
      required:
      - product_id
    CartItem:
      type: object
      description: |-
        A product card plus the cart line. `id` is the PRODUCT id. Price, image, `variant_id` and availability are
        those of the chosen variant: `cart_items()` prepares one product copy per line that way.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          description: Leave empty to generate it from the name.
          pattern: ^[-a-zA-Z0-9_]+$
        sku:
          type: string
          readOnly: true
        image:
          type: string
          format: uri
          nullable: true
          readOnly: true
        base_price:
          type: number
          format: double
          maximum: 10000000000
          minimum: -10000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          readOnly: true
        discount_price:
          type: number
          format: double
          maximum: 10000000000
          minimum: -10000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          readOnly: true
          description: What the customer pays; equals base_price without a discount.
        has_discount:
          type: boolean
          readOnly: true
        discount_type:
          type: string
          nullable: true
          readOnly: true
        discount_value:
          type: number
          format: double
          maximum: 10000000000
          minimum: -10000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          readOnly: true
        brand_name:
          type: string
          nullable: true
          readOnly: true
        total_views:
          type: integer
          readOnly: true
        total_orders:
          type: integer
          readOnly: true
        total_reviews:
          type: integer
          readOnly: true
        avg_rating:
          type: number
          format: double
          maximum: 10
          minimum: -10
          exclusiveMaximum: true
          exclusiveMinimum: true
          readOnly: true
        availability_status:
          type: boolean
          readOnly: true
        has_variants:
          type: boolean
          readOnly: true
          description: True when the customer has to pick a colour or size.
        variant_id:
          type: integer
          readOnly: true
          nullable: true
        is_favourite:
          type: boolean
          readOnly: true
        quantity:
          type: integer
          readOnly: true
        color_name:
          type: string
          nullable: true
          readOnly: true
        color_hex_code:
          type: string
          nullable: true
          readOnly: true
        size_name:
          type: string
          nullable: true
          readOnly: true
      required:
      - availability_status
      - avg_rating
      - base_price
      - brand_name
      - color_hex_code
      - color_name
      - discount_price
      - discount_type
      - discount_value
      - has_discount
      - has_variants
      - id
      - image
      - is_favourite
      - name
      - quantity
      - size_name
      - sku
      - slug
      - total_orders
      - total_reviews
      - total_views
      - variant_id
    CartRefRequest:
      type: object
      properties:
        product_id:
          type: integer
          minimum: 1
        variant_id:
          type: integer
          minimum: 1
          nullable: true
          description: Left out = every line of that product.
      required:
