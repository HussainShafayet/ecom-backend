openapi: 3.0.3
info:
  title: GoCart API
  version: 1.0.0
  description: REST API for the GoCart storefront. Every response uses the `{success,
    message, data | errors}` envelope described in docs/API_CONTRACT.md.
paths:
  /api/v1/accounts/addresses/:
    get:
      operationId: accounts_addresses_list
      summary: List my saved addresses (plain array)
      tags:
      - addresses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: OK
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Address'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        5XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: accounts_addresses_create
      summary: Save a new address
      tags:
      - addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: OK
                  data:
                    $ref: '#/components/schemas/Address'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        5XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/accounts/addresses/{id}/:
    get:
      operationId: accounts_addresses_retrieve
      summary: Get one of my addresses
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - addresses
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: OK
                  data:
                    $ref: '#/components/schemas/Address'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        5XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      operationId: accounts_addresses_update
      summary: Update an address (partial; read-only keys such as `id` are ignored)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: OK
                  data:
                    $ref: '#/components/schemas/Address'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        5XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: accounts_addresses_destroy
      summary: Delete an address
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - addresses
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: OK
                  data:
                    type: object
                    nullable: true
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        5XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/accounts/login/:
    post:
      operationId: accounts_login_create
      description: |-
        Auth endpoints are open to guests. `authentication_classes = []` also means an expired or
        garbage Authorization header (the frontend sends its stale access token to refresh/logout)
        is ignored instead of causing a 401 before the view runs.
      summary: 'Start a login: send an OTP to an existing account'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: OK
                  data:
                    $ref: '#/components/schemas/OTPSent'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        5XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/accounts/logout/:
    post:
      operationId: accounts_logout_create
      description: |-
        Auth endpoints are open to guests. `authentication_classes = []` also means an expired or
        garbage Authorization header (the frontend sends its stale access token to refresh/logout)
        is ignored instead of causing a 401 before the view runs.
      summary: Revoke the refresh token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      security:
      - {}
      responses:
        '200':
          description: Logged out (idempotent).
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: OK
                  data:
                    type: object
                    nullable: true
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        5XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/accounts/profile/:
    get:
      operationId: accounts_profile_retrieve
      summary: Get my profile
      tags:
      - profile
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: OK
                  data:
                    $ref: '#/components/schemas/Profile'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        5XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      operationId: accounts_profile_update
      description: Send only what changed, as multipart (needed for `profile_picture`)
        or JSON. A new `phone_number` or `email` is accepted only after it was verified
        through `request-otp/` + `verify-otp-for-profile/` (within a limited time,
        once per verification).
      summary: Update my profile (partial)
      tags:
      - profile
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: OK
                  data:
                    $ref: '#/components/schemas/Profile'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        5XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/accounts/register/:
    post:
      operationId: accounts_register_create
      description: |-
        Auth endpoints are open to guests. `authentication_classes = []` also means an expired or
        garbage Authorization header (the frontend sends its stale access token to refresh/logout)
        is ignored instead of causing a 401 before the view runs.
      summary: Register with a phone number and send an OTP
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: OK
                  data:
                    $ref: '#/components/schemas/OTPSent'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        5XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/accounts/request-otp/:
    post:
      operationId: accounts_request_otp_create
      summary: Send an OTP to a NEW phone number or email
      tags:
      - profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileOTPRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProfileOTPRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProfileOTPRequestRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: OK
                  data:
                    $ref: '#/components/schemas/OTPSent'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        5XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/accounts/resend-otp/:
    post:
      operationId: accounts_resend_otp_create
      description: Same token, new code. Cooldown between sends (429) and a maximum
        number of resends (400).
      summary: Send a fresh OTP for an existing token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendOTPRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: A new OTP has been sent.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: OK
                  data:
                    type: object
                    nullable: true
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        5XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/accounts/token/refresh/:
    post:
      operationId: accounts_token_refresh_create
      description: 'Returns a new `access` AND a new `refresh` (the old one is blacklisted).
        The frontend stores both. Invalid/expired/blacklisted refresh: 401.'
      summary: Rotate the refresh token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: OK
                  data:
                    $ref: '#/components/schemas/Tokens'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        5XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/accounts/verify-otp/:
    post:
      operationId: accounts_verify_otp_create
      description: Also accepts the guest's `cart` and `favorite` lists (merged by
        the shop apps).
      summary: Verify the OTP and receive the JWT pair
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyOTPRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: OK
                  data:
                    $ref: '#/components/schemas/SignIn'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        5XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/accounts/verify-otp-for-profile/:
    post:
      operationId: accounts_verify_otp_for_profile_create
      description: Wrong OTP is a 400 (never 401). After this succeeds, save the value
        with PUT /profile/.
      summary: Verify the OTP sent for a profile change
      tags:
      - profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileOTPVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProfileOTPVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProfileOTPVerifyRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: OK
                  data:
                    $ref: '#/components/schemas/ProfileOTPVerified'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        5XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: 'Readiness probe: the API is up and can reach PostgreSQL.'
      summary: Health check
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: OK
                  data:
                    $ref: '#/components/schemas/Health'
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        5XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 100
        shipping_type:
          $ref: '#/components/schemas/ShippingTypeEnum'
        address:
          type: string
          maxLength: 500
        area:
          type: string
          maxLength: 100
        division:
          type: string
          maxLength: 100
        district:
          type: string
          maxLength: 100
        thana:
          type: string
          maxLength: 100
      required:
      - address
      - id
      - shipping_type
    AddressRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 100
        shipping_type:
          $ref: '#/components/schemas/ShippingTypeEnum'
        address:
          type: string
          minLength: 1
          maxLength: 500
        area:
          type: string
          maxLength: 100
        division:
          type: string
          maxLength: 100
        district:
          type: string
          maxLength: 100
        thana:
          type: string
          maxLength: 100
      required:
      - address
      - shipping_type
    BlankEnum:
      enum:
      - ''
    FieldEnum:
      enum:
      - phone_number
      - email
      type: string
      description: |-
        * `phone_number` - phone_number
        * `email` - email
    GenderEnum:
      enum:
      - male
      - female
      - other
      type: string
      description: |-
        * `male` - Male
        * `female` - Female
        * `other` - Other
    Health:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
      - database
      - status
    LoginRequest:
      type: object
      properties:
        phone_number:
          type: string
          minLength: 1
          pattern: ^\+880\d{10}$
          maxLength: 14
      required:
      - phone_number
    LogoutRequest:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
    OTPSent:
      type: object
      properties:
        token:
          type: string
          description: Opaque URL-safe token; send it back with the OTP.
      required:
      - token
    Profile:
      type: object
      description: What GET/PUT /accounts/profile/ return (exactly the keys the frontend
        reads).
      properties:
        name:
          type: string
          readOnly: true
        username:
          type: string
          readOnly: true
          nullable: true
        email:
          type: string
          format: email
          readOnly: true
          nullable: true
        phone_number:
          type: string
          readOnly: true
        date_of_birth:
          type: string
          format: date
          readOnly: true
          nullable: true
        gender:
          allOf:
          - $ref: '#/components/schemas/GenderEnum'
          readOnly: true
        profile_picture:
          type: string
          format: uri
          nullable: true
          readOnly: true
      required:
      - date_of_birth
      - email
      - gender
      - name
      - phone_number
      - profile_picture
      - username
    ProfileOTPRequestRequest:
      type: object
      description: Ask for an OTP to verify a NEW phone number or email (exactly one
        of them).
      properties:
        phone_number:
          type: string
          minLength: 1
          pattern: ^\+880\d{10}$
          maxLength: 14
        email:
          type: string
          format: email
          minLength: 1
    ProfileOTPVerified:
      type: object
      properties:
        field:
          $ref: '#/components/schemas/FieldEnum'
        value:
          type: string
      required:
      - field
      - value
    ProfileOTPVerifyRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
        otp:
          type: string
          minLength: 1
          pattern: ^\d{6}$
      required:
      - otp
      - token
    ProfileUpdateRequest:
      type: object
      description: |-
        Every field optional: the frontend sends only what changed (or just `profile_picture`).

        phone_number / email are format-checked here; whether they were OTP-verified is enforced when saving.
        Unknown keys (is_staff, id, ...) are ignored.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        username:
          nullable: true
          oneOf:
          - type: string
            pattern: ^[A-Za-z0-9_.-]{3,50}$
            maxLength: 50
          - type: string
            maxLength: 0
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone_number:
          type: string
          minLength: 1
          pattern: ^\+880\d{10}$
          maxLength: 14
        date_of_birth:
          type: string
          format: date
          nullable: true
        gender:
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        profile_picture:
          type: string
          format: binary
    RefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        phone_number:
          type: string
          minLength: 1
          pattern: ^\+880\d{10}$
          maxLength: 14
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
      required:
      - name
      - phone_number
    ResendOTPRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - token
    ShippingTypeEnum:
      enum:
      - inside_dhaka
      - outside_dhaka
      type: string
      description: |-
        * `inside_dhaka` - Inside Dhaka
        * `outside_dhaka` - Outside Dhaka
    SignIn:
      type: object
      properties:
        tokens:
          $ref: '#/components/schemas/Tokens'
      required:
      - tokens
    Tokens:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    VerifyOTPRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
        otp:
          type: string
          minLength: 1
          pattern: ^\d{6}$
        cart:
          type: array
          items:
            type: object
            additionalProperties: {}
          maxItems: 100
        favorite:
          type: array
          items:
            type: object
            additionalProperties: {}
          maxItems: 100
      required:
      - otp
      - token
    ErrorEnvelope:
      type: object
      required:
      - success
      - message
      - error
      - errors
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation failed.
        error:
          type: string
          example: 'Phone number: This field is required.'
        errors:
          type: array
          items:
            type: string
          example:
          - 'Phone number: This field is required.'
        field_errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
