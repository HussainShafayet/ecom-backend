          minLength: 1
          pattern: ^\+880\d{10}$
          maxLength: 14
        email:
          type: string
          format: email
          minLength: 1
    ProfileOTPVerified:
      type: object
      properties:
        field:
          $ref: '#/components/schemas/FieldEnum'
        value:
          type: string
      required:
      - field
      - value
    ProfileOTPVerifyRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
        otp:
          type: string
          minLength: 1
          pattern: ^\d{6}$
      required:
      - otp
      - token
    ProfileUpdateRequest:
      type: object
      description: |-
        Every field optional: the frontend sends only what changed (or just `profile_picture`).

        phone_number / email are format-checked here; whether they were OTP-verified is enforced when saving.
        Unknown keys (is_staff, id, ...) are ignored.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        username:
          nullable: true
          oneOf:
          - type: string
            pattern: ^[A-Za-z0-9_.-]{3,50}$
            maxLength: 50
          - type: string
            maxLength: 0
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone_number:
          type: string
          minLength: 1
          pattern: ^\+880\d{10}$
          maxLength: 14
        date_of_birth:
          type: string
          format: date
          nullable: true
        gender:
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        profile_picture:
          type: string
          format: binary
    RefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        phone_number:
          type: string
          minLength: 1
          pattern: ^\+880\d{10}$
          maxLength: 14
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
      required:
      - name
      - phone_number
    ResendOTPRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - token
    Review:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product_id:
          type: integer
          readOnly: true
        user_name:
          type: string
          readOnly: true
        rating:
          type: integer
          maximum: 5
          minimum: 1
        comment:
          type: string
          maxLength: 2000
        created_at:
          type: string
          format: date-time
          readOnly: true
        can_edited:
          type: boolean
          readOnly: true
          description: True for the signed-in author of this review.
        media_urls:
          type: array
          items:
            $ref: '#/components/schemas/ReviewMedia'
          readOnly: true
      required:
      - can_edited
      - comment
      - created_at
      - id
      - media_urls
      - product_id
      - rating
      - user_name
    ReviewMedia:
      type: object
      description: '`{file, type}`: the absolute URL, and the MIME type (a `<source
        type=...>` needs one, not just "video").'
      properties:
        file:
          type: string
          format: uri
          readOnly: true
        type:
          type: string
          readOnly: true
      required:
      - file
      - type
    ReviewPage:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/Review'
        can_review:
          type: boolean
          description: A delivered order of theirs contains the product and they have
            not reviewed it yet.
      required:
      - can_review
      - count
      - next
      - previous
      - results
    ShippingTypeEnum:
      enum:
      - inside_dhaka
      - outside_dhaka
      type: string
      description: |-
        * `inside_dhaka` - Inside Dhaka
        * `outside_dhaka` - Outside Dhaka
    ShopContent:
      type: object
      description: 'Only for the schema: the payload is built in `shop_content.shop_content`.'
      properties:
        categories:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: '[{name, slug, children: [same shape]}]'
        brands:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        colors:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: '[{name, hex_code}]'
        sizes:
          type: array
          items:
            type: string
        price_range:
          type: object
          additionalProperties: {}
          description: '{min_range, max_range}: what customers pay, lowest and highest.'
        discounts:
          type: array
          items:
            type: object
            additionalProperties: {}
          description: '[{discount_type, value}]'
      required:
      - brands
      - categories
      - colors
      - discounts
      - price_range
      - sizes
      - tags
    SignIn:
      type: object
      properties:
        tokens:
          $ref: '#/components/schemas/Tokens'
      required:
      - tokens
    SizeOption:
      type: object
      properties:
        name:
          type: string
        variant_id:
          type: integer
        base_price:
          type: number
          format: double
          maximum: 10000000000
          minimum: -10000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
        discount_price:
          type: number
          format: double
          maximum: 10000000000
          minimum: -10000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
        availability_status:
          type: boolean
      required:
      - availability_status
      - base_price
      - discount_price
      - name
      - variant_id
    Tokens:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    TypeEnum:
      enum:
      - product
      - category
      - external
      type: string
      description: |-
        * `product` - A product
        * `category` - A category
        * `external` - Another website
    UserInfo:
      type: object
      properties:
        name:
          type: string
        phone_number:
          type: string
        email:
          type: string
          description: '"" when the customer has none.'
      required:
      - email
      - name
      - phone_number
    VerifyOTPRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 200
        otp:
          type: string
          minLength: 1
          pattern: ^\d{6}$
        cart:
          type: array
          items:
            type: object
            additionalProperties: {}
          maxItems: 100
        favorite:
          type: array
          items:
            type: object
            additionalProperties: {}
          maxItems: 100
      required:
      - otp
      - token
    WriteReviewRequest:
      type: object
      description: The multipart body of POST.
      properties:
        product_id:
          type: integer
          minimum: 1
        rating:
          type: integer
          maximum: 5
          minimum: 1
        comment:
          type: string
          minLength: 1
          maxLength: 2000
        media:
          type: array
          items:
            type: string
            format: binary
          description: Photos (JPEG, PNG, WebP) and videos (MP4, WebM).
      required:
      - comment
      - product_id
      - rating
    ErrorEnvelope:
      type: object
      required:
      - success
      - message
      - error
      - errors
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation failed.
        error:
          type: string
          example: 'Phone number: This field is required.'
        errors:
          type: array
          items:
            type: string
          example:
          - 'Phone number: This field is required.'
        field_errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
