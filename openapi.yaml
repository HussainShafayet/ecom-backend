    CategoryList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          description: Leave empty to generate it from the name.
          pattern: ^[-a-zA-Z0-9_]+$
        image:
          type: string
          format: uri
          nullable: true
          readOnly: true
        has_discount:
          type: boolean
          readOnly: true
        discount_amount:
          type: number
          format: double
          maximum: 10000000000
          minimum: -10000000000
          exclusiveMaximum: true
          exclusiveMinimum: true
          readOnly: true
        discount_type:
          type: string
          nullable: true
          readOnly: true
      required:
      - discount_amount
      - discount_type
      - has_discount
      - id
      - image
      - name
      - slug
    CategoryRef:
      type: object
      properties:
        name:
          type: string
