    ProfileUpdateRequest:
      type: object
      description: |-
        Every field optional: the frontend sends only what changed (or just `profile_picture`).

        phone_number / email are format-checked here; whether they were OTP-verified is enforced when saving.
        Unknown keys (is_staff, id, ...) are ignored.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        username:
          nullable: true
          oneOf:
          - type: string
            pattern: ^[A-Za-z0-9_.-]{3,50}$
            maxLength: 50
          - type: string
            maxLength: 0
        email:
          nullable: true
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        phone_number:
          type: string
          minLength: 1
          pattern: ^\+880\d{10}$
          maxLength: 14
        date_of_birth:
          type: string
          format: date
          nullable: true
        gender:
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        profile_picture:
          type: string
          format: binary
