    OrderDetail:
      type: object
      description: One of the customer's own orders, in full.
      properties:
        order_id:
          type: string
          description: e.g. GC-20260923-0001; use it in /orders/{order_id}/.
        status:
          $ref: '#/components/schemas/StatusEnum'
        status_display:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        total:
          type: number
          format: double
          maximum: 10000000000
          minimum: 0
          exclusiveMaximum: true
        items_count:
          type: integer
          readOnly: true
          description: 'Units, not lines: two of one product and one of another is
            3.'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        name:
          type: string
          maxLength: 150
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
