        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: OK
                  data:
                    type: array
                    items:
                      type: string
                    maxItems: 10
          description: ''
        4XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        5XX:
          description: Error envelope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    ActionEnum:
      enum:
      - increase
      - decrease
      type: string
      description: |-
        * `increase` - increase
        * `decrease` - decrease
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 100
        shipping_type:
          $ref: '#/components/schemas/ShippingTypeEnum'
        address:
          type: string
          maxLength: 500
        area:
          type: string
          maxLength: 100
        division:
          type: string
          maxLength: 100
        district:
          type: string
          maxLength: 100
        thana:
          type: string
          maxLength: 100
      required:
      - address
      - id
      - shipping_type
    AddressRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 100
        shipping_type:
          $ref: '#/components/schemas/ShippingTypeEnum'
        address:
          type: string
          minLength: 1
          maxLength: 500
        area:
          type: string
          maxLength: 100
        division:
          type: string
          maxLength: 100
        district:
          type: string
          maxLength: 100
        thana:
          type: string
          maxLength: 100
      required:
      - address
      - shipping_type
